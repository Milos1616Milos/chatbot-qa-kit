name: Sample check
on: [push, pull_request]
permissions:
  contents: read
jobs:
  sample:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Run example cases
        run: python3 qa.py example.json --output report.md
      - name: Run industry examples
        run: |
          python3 qa.py examples/ecommerce-policy.json --output ecommerce-report.md
          python3 qa.py examples/support-escalation.json --output support-report.md
